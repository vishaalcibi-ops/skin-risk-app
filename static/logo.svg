<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shield Glow -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="shield_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Protective Shield -->
  <path d="M256 40C256 40 420 80 420 180C420 320 256 440 256 440C256 440 92 320 92 180C92 80 256 40 256 40Z" 
        stroke="url(#shield_grad)" stroke-width="12" fill="rgba(30, 41, 59, 0.4)" filter="url(#glow)"/>

  <!-- Android Mascot (Simplified) -->
  <g transform="translate(180, 160) scale(0.8)">
    <!-- Body -->
    <rect x="24" y="56" width="144" height="120" rx="12" fill="#22C55E" />
    <!-- Head -->
    <path d="M24 44C24 19.6995 43.6995 0 68 0H124C148.301 0 168 19.6995 168 44V48H24V44Z" fill="#22C55E" />
    <!-- Eyes -->
    <circle cx="68" cy="24" r="8" fill="white" />
    <circle cx="124" cy="24" r="8" fill="white" />
    <!-- Antennas -->
    <line x1="16" y1="-10" x2="36" y2="10" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />
    <line x1="176" y1="-10" x2="156" y2="10" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />
    <!-- Arms -->
    <rect x="-12" y="56" width="24" height="80" rx="12" fill="#22C55E" />
    <rect x="180" y="56" width="24" height="80" rx="12" fill="#22C55E" />
  </g>

  <!-- Magnifying Glass (Over the Head) -->
  <g transform="translate(260, 200)">
    <!-- Handle -->
    <line x1="40" y1="40" x2="100" y2="100" stroke="#94A3B8" stroke-width="20" stroke-linecap="round" />
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="70" stroke="white" stroke-width="12" fill="rgba(6, 182, 212, 0.2)" />
    <!-- Inner Lens Reflection -->
    <circle cx="-20" cy="-20" r="15" fill="white" fill-opacity="0.3" />
    <!-- Skin "Spot" under lens -->
    <circle cx="0" cy="0" r="12" fill="#F43F5E" />
  </g>
</svg>
